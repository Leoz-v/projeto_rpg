appId: dev.vtt.app
productName: VTT
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**
  - package.json
  - '!**/*.map'
asarUnpack:
  - '**/*.node'
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target: AppImage
  category: Game
mac:
  target: dmg
  category: public.app-category.role-playing-games
npmRebuild: true
publish:
  provider: github
