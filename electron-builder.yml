appId: dev.vtt.app
productName: VTT
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**
  - package.json
  - '!**/*.map'
extraResources:
  - from: resources/3d-assets
    to: 3d-assets
asarUnpack:
  - '**/*.node'
win:
  target: nsis
nsis:
  # Sem espaços: o mesmo nome no GitHub e no latest.yml do electron-updater.
  artifactName: VTT-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target: AppImage
  category: Game
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.role-playing-games
npmRebuild: true
# Releases no GitHub (nota 0048): o workflow `release.yml` publica como rascunho;
# o dono do repositório confere e publica, e só então o `electron-updater` a enxerga.
publish:
  provider: github
  owner: Leoz-v
  repo: projeto_rpg
  releaseType: draft
