name: Release

# Uma tag `vX.Y.Z` na `main` gera os instaladores (Windows, Linux, Mac) e os
# publica num rascunho de release no GitHub, com o `latest.yml` que o
# `electron-updater` usa (sha512 de cada arquivo). O dono do repositório confere
# e publica o rascunho; só então os apps se atualizam. Ver nota 0048.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      # A tag precisa bater com a versão do package.json: é ela que nomeia a release e o latest.yml.
      - name: Check tag matches package version
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "A tag $GITHUB_REF_NAME não bate com a versão do package.json ($version)." >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm typecheck && pnpm lint && pnpm test

      - name: Build and publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Sem certificado de assinatura (CLAUDE.md): o electron-builder não procura um.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm exec electron-vite build && pnpm exec electron-builder --publish always
