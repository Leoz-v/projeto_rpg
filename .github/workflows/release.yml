name: Release

# Uma tag `vX.Y.Z` na `main` gera os instaladores (Windows, Linux, Mac) e os
# publica num rascunho de release no GitHub, com o `latest.yml` que o
# `electron-updater` usa (sha512 de cada arquivo). O dono do repositório confere
# e publica o rascunho; só então os apps se atualizam. Ver nota 0048.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # O rascunho nasce antes dos builds: criado por eles, uploads simultâneos
  # fizeram dois rascunhos e dividiram os arquivos (nota 0072).
  draft:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Create the draft release
        run: |
          # A lista inclui os rascunhos (o token tem escrita). Rodar de novo reaproveita o que existe.
          count=$(gh api "repos/$GH_REPO/releases?per_page=100" --jq "[.[] | select(.tag_name == \"$GITHUB_REF_NAME\")] | length")
          if [ "$count" -gt 1 ]; then
            echo "Há $count releases da $GITHUB_REF_NAME: deixe só uma e rode de novo." >&2
            exit 1
          fi
          if [ "$count" -eq 0 ]; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "${GITHUB_REF_NAME#v}" --notes ""
          fi

  build:
    needs: draft
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      # A tag precisa bater com a versão do package.json: é ela que nomeia a release e o latest.yml.
      - name: Check tag matches package version
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "A tag $GITHUB_REF_NAME não bate com a versão do package.json ($version)." >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm typecheck && pnpm lint && pnpm test

      - name: Build and publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Sem certificado de assinatura (CLAUDE.md): o electron-builder não procura um.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm exec electron-vite build && pnpm exec electron-builder --publish always

  # O electron-builder termina verde mesmo quando um arquivo não sobe.
  check:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check the draft has every file
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh api "repos/$GH_REPO/releases?per_page=100" --jq "[.[] | select(.tag_name == \"$GITHUB_REF_NAME\")]" > releases.json
          if [ "$(jq length releases.json)" -ne 1 ]; then
            echo "Esperava uma release da $GITHUB_REF_NAME, há $(jq length releases.json)." >&2
            exit 1
          fi
          jq -r '.[0].assets[] | select(.state == "uploaded") | .name' releases.json | sort > found.txt
          for file in "VTT-Setup-$version.exe" "VTT-$version.dmg" "VTT-$version-arm64.dmg"; do
            echo "$file"
            echo "$file.blockmap"
          done > expected.txt
          for file in "VTT-$version.AppImage" latest.yml latest-linux.yml latest-mac.yml; do
            echo "$file"
          done >> expected.txt
          sort -o expected.txt expected.txt
          missing=$(comm -23 expected.txt found.txt)
          if [ -n "$missing" ]; then
            echo "Faltam arquivos no rascunho:" >&2
            echo "$missing" >&2
            exit 1
          fi
